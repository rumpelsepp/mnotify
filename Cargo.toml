[package]
name = "mnotify"
version = "0.2.0"
description = "Send and receive Matrix messages from scripts and headless servers"
edition = "2024"
rust-version = "1.93"
keywords = ["matrix", "chat", "messaging", "cli"]
readme = "README.md"
repository = "https://github.com/rumpelsepp/mnotify"
license = "EUPL-1.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.71", features = ["backtrace"] }
clap = { version = "4.2.7", features = ["derive", "cargo", "env"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
futures = "0.3.26"
# Only for the MSC4153 trust settings, which matrix-sdk does not re-export.
matrix-sdk-crypto = "0.19.1"
jiff = "0.2.37"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring = "4.2.0"
mime = "0.3.17"
mime_guess = "2.0.5"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.10.3"
cli-prompts = "0.1.1"
comfy-table = "8.0.1"
rpassword = "7.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.31.0", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-std",
    "io-util",
    "time",
] }
tracing = "0.1.37"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
xdg = "3.0.0"

[dependencies.matrix-sdk]
version = "0.19.1"
features = ["anyhow", "markdown", "socks", "bundled-sqlite", "qrcode", "sso-login"]

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "3.0.3"
tempfile = "3.27.0"

[[bin]]
name = "mn"
path = "src/main.rs"
