[package]
name = "mnotify"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
keywords = ["matrix", "chat", "messaging", "cli"]
readme = "README.md"
repository = "https://github.com/rumpelsepp/mnotify"
license = "EUPL-1.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.71", features = ["backtrace"] }
clap = { version = "4.2.7", features = ["derive", "cargo"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
futures = "0.3.26"
keyring = "4.2.0"
mime = "0.3.17"
cli-prompts = "0.1.1"
rpassword = "7.2.0"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0.96"
tokio = { version = "1.31.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
xdg = "3.0.0"

[dependencies.matrix-sdk]
version = "0.18.0"
features = ["anyhow", "markdown", "socks", "bundled-sqlite"]

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "3.0.3"

[[bin]]
name = "mn"
path = "src/main.rs"
