on: [push, pull_request]

name: ci

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run format check
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets

      - name: Run tests
        run: cargo test
